[project]
name = "quantstrat-ml-asset-pricing"
version = "0.1.0"
description = "Clean NN5 rank-optimized asset-pricing strategy workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "polars>=0.20",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "jax>=0.4",
]

[project.optional-dependencies]
models = [
  "torch>=2.0",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["N999"]
