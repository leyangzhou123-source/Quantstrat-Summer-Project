[project]
name = "quantstrat-ml-asset-pricing"
version = "0.1.0"
description = "Research scaffold for reproducing an empirical asset pricing machine-learning workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "polars>=0.20",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]
models = [
  "jax>=0.4",
  "xgboost>=2.0",
  "torch>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
  # Existing model modules use paper/model names such as NN5.py and OLS.py.
  "N999",
]
