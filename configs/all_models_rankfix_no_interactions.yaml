project:
  name: quantstrat_all_ml_models_rankfix
  random_seed: 42

data:
  frequency: monthly
  date_column: month
  asset_id_column: permno
  target_column: ret_excess_lead1
  weight_column: me
  industry_column: sic2
  processed_panel_path: data/processed/model_penal_gkx_clean_rankfix.parquet
  manifest_path: data/processed/model_penal_gkx_clean_rankfix_manifest.json

features:
  feature_set: no_interactions
  macro_predictors:
    - dp
    - ep
    - bm
    - ntis
    - tbl
    - tms
    - dfy
    - svar

splits:
  scheme: paper_rolling
  train_start: "1957-03-31"
  validation_years: 12
  first_test_year: 1987
  last_test_year: 2016

models:
  enabled:
    - ols
    - ridge
    - elastic_net
    - elastic_net_huber
    - ols_huber
    - ols_3
    - pcr
    - pls
    - glm_huber
    - random_forest
    - gbrt_huber
    - nn1
    - nn2
    - nn3
    - nn4
    - nn5
    - transformer_nn

model_params:
  common: &common
    use_sample_weight: false
    weighted_validation: false
    drop_features_after_matrix: true
    standardize_target: true
    forecast_clip: [-0.05, 0.05]
    scale_features: true

  common_linear: &common_linear
    <<: *common
    backend: jax
    fit_intercept: true
    ridge_jitter: 0.000001

  ols:
    <<: *common_linear
    model_name: ols
    validation_grid:
      alpha: [0.0]

  ridge:
    <<: *common_linear
    validation_grid:
      alpha: [1000000.0, 10000000.0, 100000000.0]

  elastic_net:
    <<: *common
    max_iter: 1000
    tol: 0.0001
    validation_grid:
      alpha: [0.0001, 0.001]
      l1_ratio: [0.1, 0.5]

  ols_huber:
    <<: *common
    fit_intercept: true
    max_iter: 1000
    tol: 0.0001
    validation_grid:
      epsilon: [0.05, 0.1]
      eta0: [0.0001]

  ols_3:
    <<: *common
    model_name: ols_3
    feature_set: ols_3
    fit_intercept: true
    solver: sklearn

  pcr:
    <<: *common_linear
    validation_grid:
      n_components: [5, 10, 25]
      alpha: [1000000.0, 10000000.0]

  pls:
    <<: *common
    max_iter: 500
    tol: 0.000001
    validation_grid:
      n_components: [3, 5, 10]

  elastic_net_huber:
    <<: *common
    max_iter: 1000
    tol: 0.0001
    validation_grid:
      alpha: [0.0001, 0.001]
      l1_ratio: [0.1, 0.5]
      epsilon: [0.1]

  glm_huber:
    <<: *common
    degree: 2
    max_iter: 800
    tol: 0.0001
    validation_grid:
      n_knots: [3]
      alpha: [0.0001]
      l1_ratio: [0.5]
      epsilon: [0.1]

  random_forest:
    <<: *common
    n_jobs: -1
    scale_features: false
    standardize_target: false
    validation_grid:
      n_estimators: [50]
      max_depth: [3, 5]
      min_samples_leaf: [250, 500]
      max_features: [sqrt]

  gbrt_huber:
    <<: *common
    scale_features: false
    standardize_target: false
    validation_grid:
      n_estimators: [25, 50]
      learning_rate: [0.03, 0.05]
      max_depth: [2]
      min_samples_leaf: [250, 500]
      max_features: [sqrt]

  nn1: &nn_defaults
    <<: *common
    backend: jax
    output_ridge: false
    layer_widths: [32, 16, 8, 4, 2]
    ensemble_seeds: [42, 43, 44]
    activation: relu
    batch_size: 8192
    max_iter: 100
    validate_every: 1
    early_stopping: true
    n_iter_no_change: 8
    tol: 0.000001
    learning_rate_decay: 0.99
    zero_output_init: false
    output_init_scale: 0.01
    clip_grad_norm: 5.0
    prediction_batch_size: 65536
    validation_selection_metric: spearman_ic
    validation_date_column: month
    validation_grid:
      alpha: [0.000001, 0.00001, 0.0001]
      learning_rate_init: [0.0001]
  nn2: *nn_defaults
  nn3: *nn_defaults
  nn4: *nn_defaults
  nn5: *nn_defaults

  transformer_nn:
    <<: *common
    device: auto
    head_batch_size: 8192
    training_epochs: 5
    head_n_iter_no_change: 3
    prediction_batch_size: 65536
    progress_every: 1
    ensemble_seeds: [42]
    validation_grid:
      n_tokens: [6, 12]
      d_model: [8, 16]
      n_heads: [1]
      n_layers: [1]
      dropout: [0.0]
      head_layers:
        - [16]
      weight_decay: [0.0001, 0.001]
      learning_rate: [0.001]

evaluation:
  benchmark_forecast: zero
  weighted_oos_r2: false
  portfolio_deciles: 10
  annualization_factor: 12
  newey_west_lags: 12
