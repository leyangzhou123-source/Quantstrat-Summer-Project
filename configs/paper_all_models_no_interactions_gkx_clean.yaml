project:
  name: quantstrat_ml_asset_pricing
  random_seed: 42

data:
  frequency: monthly
  date_column: month
  asset_id_column: permno
  target_column: ret_excess_lead1
  weight_column: me
  industry_column: sic2
  processed_panel_path: data/processed/model_penal_gkx_clean.parquet
  manifest_path: data/processed/model_penal_gkx_clean_manifest.json

features:
  feature_set: no_interactions
  macro_predictors:
    - dp
    - ep
    - bm
    - ntis
    - tbl
    - tms
    - dfy
    - svar

splits:
  scheme: paper_rolling
  train_start: "1957-03-31"
  validation_years: 12
  first_test_year: 1987
  last_test_year: 2016

models:
  enabled:
    - ols
    - ridge
    - elastic_net
    - pcr
    - random_forest
    - nn1
    - nn2
    - nn3
    - nn4
    - nn5

model_params:
  ols:
    model_name: ols
    fit_intercept: true
    solver: sklearn
    scale_features: true
    drop_features_after_matrix: true
  ridge:
    backend: jax
    fit_intercept: true
    solver: lsqr
    scale_features: true
    drop_features_after_matrix: true
    validation_grid:
      alpha: [10000000.0, 100000000.0, 1000000000.0, 10000000000.0]
  elastic_net:
    fit_intercept: true
    max_iter: 3000
    tol: 0.0001
    selection: cyclic
    scale_features: true
    drop_features_after_matrix: true
    validation_grid:
      alpha: [0.1, 1.0, 10.0, 100.0]
      l1_ratio: [0.01, 0.05, 0.1, 0.5]
  pcr:
    backend: jax
    scale_features: true
    drop_features_after_matrix: true
    validation_grid:
      n_components: [3, 5, 10, 25]
      alpha: [1000000.0, 100000000.0, 10000000000.0]
  random_forest:
    n_jobs: -1
    scale_features: false
    drop_features_after_matrix: true
    validation_grid:
      n_estimators: [50]
      max_depth: [2, 3, 4]
      min_samples_leaf: [500, 1000]
      max_features: [sqrt]
  nn1: &nn_defaults
    backend: jax
    output_ridge: true
    layer_widths: [32, 16, 8, 4, 2]
    ensemble_seeds: [42, 43, 44]
    activation: relu
    batch_size: 8192
    max_iter: 100
    early_stopping: true
    validation_fraction: 0.1
    n_iter_no_change: 8
    learning_rate_decay: 0.99
    zero_output_init: false
    standardize_target: true
    clip_grad_norm: 5.0
    forecast_clip: [-0.05, 0.05]
    output_shrinkage_grid: [0.0, 0.001, 0.005, 0.01, 0.025, 0.05, 0.1]
    prediction_batch_size: 65536
    scale_features: true
    drop_features_after_matrix: true
    validation_grid:
      alpha: [1000000.0, 10000000.0, 100000000.0]
      learning_rate_init: [0.0001]
  nn2: *nn_defaults
  nn3: *nn_defaults
  nn4: *nn_defaults
  nn5: *nn_defaults

evaluation:
  benchmark_forecast: zero
  weighted_oos_r2: true
  portfolio_deciles: 10
  annualization_factor: 12
  newey_west_lags: 12
