project:
  name: quantstrat_ml_asset_pricing
  random_seed: 42

data:
  frequency: monthly
  date_column: month
  asset_id_column: permno
  target_column: ret_excess_lead1
  weight_column: me
  industry_column: sic2
  processed_panel_path: data/processed/model_penal.parquet
  manifest_path: data/processed/model_penal_manifest.json

features:
  feature_set: no_interactions
  macro_predictors: [dp, ep, bm, ntis, tbl, tms, dfy, svar]

splits:
  scheme: paper_rolling
  train_start: "1957-03-31"
  validation_years: 12
  first_test_year: 1987
  last_test_year: 2016

models:
  enabled: [transformer_nn]

model_params:
  transformer_nn:
    scale_features: true
    use_sample_weight: true
    weighted_validation: true
    forecast_clip: [-0.05, 0.05]
    prediction_batch_size: 65536
    progress_every: 12
    ensemble_seeds: [42, 43, 44]
    head_activation: relu
    head_batch_size: 8192
    head_max_iter: 500
    head_early_stopping: true
    head_validation_fraction: 0.1
    head_n_iter_no_change: 15
    validation_grid:
      head_type: [mlp]
      n_tokens: [6, 9, 12]
      d_model: [8, 16]
      n_layers: [1, 2]
      projection_scale: [0.15, 0.25, 0.35]
      head_layers:
        - [16]
        - [32, 16]
      head_alpha: [0.0001, 0.001]
      head_learning_rate_init: [0.0003, 0.001]

evaluation:
  benchmark_forecast: zero
  weighted_oos_r2: true
  portfolio_deciles: 10
  annualization_factor: 12
  newey_west_lags: 12
